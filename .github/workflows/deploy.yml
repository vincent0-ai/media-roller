name: Build Image and Deploy to Dokploy

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL repository secret is not set."
            exit 1
          fi

          # Body is written to a file and never printed: the response can echo the
          # webhook path, which is the deploy token.
          body_file="$(mktemp)"
          status=$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
            --retry 2 --retry-delay 5 --retry-connrefused --max-time 60 \
            -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json") || status=000

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Dokploy accepted the deployment (HTTP $status)."
            rm -f "$body_file"
            exit 0
          fi

          echo "::error::Dokploy webhook returned HTTP $status."
          if grep -qi 'challenge-platform\|Just a moment' "$body_file" 2>/dev/null; then
            echo "::error::Cloudflare answered with a challenge page, not Dokploy. Allow /api/deploy/* through the zone's WAF, or point the secret at a hostname that is DNS-only."
          fi
          rm -f "$body_file"
          exit 1
